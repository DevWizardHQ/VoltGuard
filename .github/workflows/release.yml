name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: VoltGuard
  BUNDLE_ID: com.devwizardhq.voltguard

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        # Swift 6 tools are required for swift-tools-version: 6.0 and the
        # Swift Testing macros.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test before shipping
        run: swift test

      # A stable signing identity is what lets macOS carry notification
      # permission and the login-item approval across updates; an ad-hoc
      # signature changes identity per build and resets both.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12" ]]; then
            echo "SIGNING_CERT_P12 is not set; the build will be ad-hoc signed." >&2
            exit 0
          fi
          echo "$CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci-temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-temp build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-temp build.keychain >/dev/null
          if ! security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application"; then
            # Self-signed identities have to be trusted before codesign accepts them.
            openssl pkcs12 -in cert.p12 -clcerts -nokeys -passin "pass:$CERT_PASSWORD" -out cert.pem
            sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain cert.pem
            rm cert.pem
          fi
          rm cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Build universal bundle
        run: make bundle VERSION=${{ steps.version.outputs.version }} BUILD=${{ github.run_number }}

      - name: Verify the binary is universal
        run: |
          ARCHS="$(lipo -archs dist/VoltGuard.app/Contents/MacOS/VoltGuard)"
          echo "$ARCHS"
          grep -q arm64 <<<"$ARCHS" && grep -q x86_64 <<<"$ARCHS"

      - name: Sign
        run: make sign

      - name: Confirm the signed app actually launches
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          dist/VoltGuard.app/Contents/MacOS/VoltGuard > rel.out 2> rel.err &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "signed app runs"
            exit 0
          fi
          echo "the signed app exited immediately — refusing to publish"
          cat rel.out; cat rel.err
          exit 1

      - name: Package zip for Sparkle
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent VoltGuard.app VoltGuard.zip
          shasum -a 256 VoltGuard.zip > VoltGuard.zip.sha256

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package dmg
        run: make dmg VERSION=${{ steps.version.outputs.version }}

      - name: Fail if the dmg was built unstyled
        run: test -f Resources/Assets/dmg-background.tiff && command -v create-dmg

      - name: Notarize and staple
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NOTARY_ISSUER_ID" ]]; then
            echo "Notary credentials absent; shipping signed but un-notarized." >&2
            exit 0
          fi
          printf '%s' "$NOTARY_PRIVATE_KEY" > notary.p8
          NOTARY_KEY_PATH="$PWD/notary.p8" ./Scripts/notarize.sh dist/VoltGuard.dmg
          # The stapled dmg invalidates the earlier zip, so repackage from the
          # stapled app to keep the Sparkle archive in sync.
          rm -f notary.p8

      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "VoltGuard $VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "VoltGuard ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            dist/VoltGuard.dmg dist/VoltGuard.dmg.sha256 \
            dist/VoltGuard.zip dist/VoltGuard.zip.sha256

      - name: Publish the appcast to the site
        run: |
          set -euo pipefail
          git config user.name "IQBAL HASAN"
          git config user.email "iqbalhasan.dev@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          cp dist/appcast.xml site/appcast.xml
          if git diff --quiet -- site/appcast.xml; then
            echo "appcast unchanged"
            exit 0
          fi
          git add site/appcast.xml
          git commit -m "chore: publish appcast for ${{ steps.version.outputs.tag }}"
          git push origin main
