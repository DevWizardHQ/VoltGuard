name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The only workflow that deploys Pages. A second deployer would replace the
# whole site on its own schedule and delete appcast.xml, breaking the update
# check for every installed copy against a URL compiled into the binary.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the appcast is present and well-formed
        run: |
          test -f site/appcast.xml
          python3 -c "import xml.etree.ElementTree as e; e.parse('site/appcast.xml')"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
