<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 60" width="176" height="60" role="img" aria-label="Battery charging" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Battery charging</title>

  <!-- Tweak: the green in the style block, and the width of .level
       (0 = empty, 161 = full). Background stays transparent. -->
  <defs>
    <style>
      .full  { fill: #4EBC73; }
      .empty { fill: #4EBC73; opacity: .42; }
      .cap   { fill: #4EBC73; }
      .bolt  { fill: #FFFFFF; }
    </style>

    <clipPath id="bodyClip">
      <rect x="0" y="0" width="161" height="60" rx="11" ry="11"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bodyClip)">
    <rect class="empty" x="0" y="0" width="161" height="60"/>
    <rect class="full level" x="0" y="0" width="105" height="60"/>
  </g>

  <path class="cap" d="M164 17.5h7a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5h-7z"/>

  <path class="bolt" d="M84.5 14 L70 32.5 h7.5 L73.5 46 L88 27.5 h-7.5 Z"/>
</svg>
